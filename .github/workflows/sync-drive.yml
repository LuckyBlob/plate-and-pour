name: Sync data from Adversaire drive

# data.json (served same-origin by GitHub Pages) mirrors the live Google Drive
# file, so networks that block Google still see up-to-date data.
#
# Real-time sync is EVENT-DRIVEN, not polled: the Apps Script web app pushes
# every save straight to data.json via the GitHub API (see drive-bridge.gs ->
# pushToGitHub), so the mirror updates within seconds of the Drive file being
# modified. This workflow is only a manual, on-demand backstop for that push.

on:
  workflow_dispatch: {}        # manual "Run workflow" — on-demand backstop only

permissions:
  contents: write

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the live drive data
        run: |
          curl -sSL --max-time 60 \
            "https://script.google.com/macros/s/AKfycbyTQNKOZRoDZlhBovwptpJif3jvNrXgq5BsTZvs9B5qXqKyXupjV57c_7qs25R_STvN/exec" \
            -o fetched.json

      - name: Validate it is a real dataset
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('fetched.json', encoding='utf-8'))
          assert isinstance(d.get('recipes'), list), 'no recipes array'
          assert isinstance(d.get('elements'), list) and d['elements'], 'no elements'
          print('valid:', len(d['elements']), 'elements,', len(d['recipes']), 'recipes')
          PY

      - name: Commit data.json if it changed
        run: |
          mv fetched.json data.json
          git add data.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git config user.name  "adversaire-drive-sync"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Sync data.json from Adversaire drive"
            git push
          fi

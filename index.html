<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plate &amp; Pour — recipe cost &amp; pricing</title>
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --paper:#F3F2EA;--surface:#FBFAF4;--surface-2:#EBEAE0;--line:#DAD7C9;--line-strong:#C6C2B0;
    --ink:#1B221E;--ink-2:#54605A;--ink-3:#8A938C;--accent:#1E5B4F;--accent-2:#2A7D6C;--accent-soft:#E1EBE6;
    --brass:#8C6A20;--info:#2F6DB0;--good:#2E7D57;--warn:#A9761B;--bad:#B2453A;
    --good-soft:#E2EEE7;--warn-soft:#F4ECD8;--bad-soft:#F5E4E1;
    --shadow:0 1px 2px rgba(27,34,30,.06), 0 6px 22px rgba(27,34,30,.06);
    --shadow-pop:0 12px 40px rgba(27,34,30,.22);--r:10px;
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#12160F;--surface:#1A1F17;--surface-2:#232A20;--line:#333B2F;--line-strong:#455040;
      --ink:#E9E7DA;--ink-2:#A7B0A4;--ink-3:#79837A;--accent:#3FA089;--accent-2:#54BBA2;--accent-soft:#1E2C27;
      --brass:#CBA351;--info:#6FB0F0;--good:#5CBE8C;--warn:#D2A24B;--bad:#E0776B;
      --good-soft:#1B2A22;--warn-soft:#2B2513;--bad-soft:#2E1D1A;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.35);--shadow-pop:0 12px 44px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12160F;--surface:#1A1F17;--surface-2:#232A20;--line:#333B2F;--line-strong:#455040;
    --ink:#E9E7DA;--ink-2:#A7B0A4;--ink-3:#79837A;--accent:#3FA089;--accent-2:#54BBA2;--accent-soft:#1E2C27;
    --brass:#CBA351;--info:#6FB0F0;--good:#5CBE8C;--warn:#D2A24B;--bad:#E0776B;
    --good-soft:#1B2A22;--warn-soft:#2B2513;--bad-soft:#2E1D1A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.35);--shadow-pop:0 12px 44px rgba(0,0,0,.55);
  }
  :root[data-theme="light"]{
    --paper:#F3F2EA;--surface:#FBFAF4;--surface-2:#EBEAE0;--line:#DAD7C9;--line-strong:#C6C2B0;
    --ink:#1B221E;--ink-2:#54605A;--ink-3:#8A938C;--accent:#1E5B4F;--accent-2:#2A7D6C;--accent-soft:#E1EBE6;
    --brass:#8C6A20;--info:#2F6DB0;--good:#2E7D57;--warn:#A9761B;--bad:#B2453A;
    --good-soft:#E2EEE7;--warn-soft:#F4ECD8;--bad-soft:#F5E4E1;
    --shadow:0 1px 2px rgba(27,34,30,.06), 0 6px 22px rgba(27,34,30,.06);--shadow-pop:0 12px 40px rgba(27,34,30,.22);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .tnum{font-variant-numeric:tabular-nums}
  button{font-family:inherit}
  h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;text-wrap:balance;letter-spacing:.1px}

  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{max-width:1120px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .mark{width:32px;height:32px;flex:none;color:var(--accent)}
  .brand h1{font-size:21px;line-height:1;letter-spacing:.2px}
  .brand .sub{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:1.4px;margin-top:3px}
  .hactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  nav.tabs{max-width:1120px;margin:0 auto;padding:6px 12px 0;display:flex;gap:2px;overflow-x:auto}
  nav.tabs button{appearance:none;border:0;background:none;color:var(--ink-2);cursor:pointer;padding:11px 14px;font-size:14px;font-weight:550;border-bottom:2.5px solid transparent;white-space:nowrap;border-radius:6px 6px 0 0;transition:color .15s,border-color .15s,background .15s}
  nav.tabs button:hover{color:var(--ink);background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
  nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

  main{max-width:1120px;margin:0 auto;padding:22px 20px 80px}

  .btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:8px;font-size:13.5px;font-weight:550;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .14s,border-color .14s,transform .05s}
  .btn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
  .btn.danger:hover{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--line-strong);background:var(--surface)}
  .btn.sm{padding:5px 9px;font-size:12.5px}
  .btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible,.iconbtn:focus-visible,.grouphead:focus-visible,.ovreset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .iconbtn{appearance:none;border:0;background:none;color:var(--ink-3);cursor:pointer;padding:5px;border-radius:6px;line-height:0}
  .iconbtn:hover{color:var(--ink);background:var(--surface-2)}
  .iconbtn.danger:hover{color:var(--bad);background:var(--bad-soft)}

  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%}
  input::placeholder{color:var(--ink-3)}
  input[type=number]{font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  label.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.6px}
  label.field input,label.field select{text-transform:none;font-weight:400;letter-spacing:normal;font-size:14px;color:var(--ink)}

  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-3);font-weight:600}
  .stat .v{font-family:var(--font-display);font-size:27px;margin-top:6px;letter-spacing:.3px}

  .sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
  .sectionhead h2{font-size:19px}
  .sectionhead .hint{font-size:13px;color:var(--ink-3)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .cardhead h3{font-size:15px;font-family:var(--font-sans);font-weight:650}
  .table-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:600px}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  thead th{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-2);font-weight:650;white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .name-cell{font-weight:600}
  .rname{cursor:pointer}
  .rname:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  .money{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .cost{font-family:var(--font-mono);color:var(--ink-2)}
  .rowactions{display:flex;gap:2px;justify-content:flex-end}
  .inline-input{padding:6px 8px;font-size:13.5px}
  td .inline-input{max-width:100%}
  .rowsub{font-size:12px;color:var(--ink-3);margin-top:2px;font-weight:400}
  /* Notes edit where they sit: click the text, type, click away. The box only shows up under the pointer. */
  .noteline{display:flex;align-items:flex-start;gap:2px;margin-top:2px}
  .note{flex:1 1 auto;min-width:0;margin:0 0 0 -5px;padding:2px 5px;border:1px solid transparent;border-radius:6px;cursor:text;white-space:pre-wrap;overflow-wrap:anywhere}
  .note:hover{border-color:var(--line-strong);background:var(--paper)}
  .note:focus{outline:none;border-color:var(--accent);background:var(--paper);color:var(--ink-2)}
  .note:empty::before{content:attr(data-ph);color:var(--ink-3);opacity:0;transition:opacity .12s}
  tr:hover .note:empty::before,.note:empty:focus::before{opacity:.75}
  .notedel{flex:0 0 auto;margin-top:1px;padding:3px;border:0;border-radius:5px;background:transparent;color:var(--ink-3);line-height:0;cursor:pointer;opacity:0;transition:opacity .12s}
  tr:hover .notedel{opacity:1}
  .notedel:hover{color:var(--bad);background:var(--bad-soft)}
  .notedel[hidden]{display:none}

  /* override cells (markup / price) */
  .ovcell{display:flex;align-items:center;gap:3px;justify-content:flex-end}
  .ovinput{width:60px;text-align:right;padding:5px 7px;font-size:13.5px;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .ovinput.price{width:74px;color:var(--brass);font-weight:600}
  .ovinput.ov-red{color:var(--bad)!important;border-color:var(--bad);font-weight:600}
  .ovinput.ov-blue{color:var(--info)!important;border-color:var(--info);font-weight:600}
  .ovcell .suf,.ovcell .pre{color:var(--ink-3);font-size:12px;font-family:var(--font-mono)}
  .ovreset{appearance:none;border:0;background:none;color:var(--ink-3);cursor:pointer;padding:2px;border-radius:5px;line-height:0}
  .ovreset:hover{color:var(--accent);background:var(--surface-2)}
  .ovreset[hidden]{display:none}

  /* collapsible category groups */
  .group{margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .grouphead{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface-2);border:0;cursor:pointer;text-align:left;color:var(--ink);transition:background .14s}
  .grouphead:hover{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface-2))}
  .grouphead[aria-expanded="true"]{border-bottom:1px solid var(--line)}
  .grouphead .chev{color:var(--ink-3);line-height:0;transition:transform .18s}
  .grouphead[aria-expanded="false"] .chev{transform:rotate(-90deg)}
  .grouphead h3{font-size:15px;font-family:var(--font-sans);font-weight:650}
  .grouphead .gcount{color:var(--ink-3);font-size:12.5px;font-weight:500}
  .grouphead .gmarkup{margin-left:auto;color:var(--ink-2);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .groupbody[hidden]{display:none}
  .group thead th{background:var(--surface)}
  .sortable{cursor:pointer;user-select:none}
  .sortable:hover{color:var(--ink)}
  .sortarrow{color:var(--accent);font-size:10px;margin-left:2px}
  .mark-ok{color:var(--good);line-height:0}
  .mark-no{color:var(--bad);line-height:0}
  .cell-margin{white-space:nowrap}
  .elnotes{margin-top:4px;font-size:12px;color:var(--ink-2);padding:3px 8px;border-style:dashed}
  .eldate{text-align:right;white-space:nowrap}
  .el-main>td{border-bottom:0}
  .el-portion>td{padding-top:0;padding-bottom:12px}
  .el-main .cell-portioncost{color:var(--ink)}
  .portion-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .portion-line .switch{white-space:nowrap}
  .portion-box{display:inline-grid;grid-template-columns:auto auto auto auto;align-items:center;gap:7px 8px;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--paper);font-size:13px;color:var(--ink-2)}
  /* A select will happily shrink to just its arrow, which makes the table squeeze the unit dropdowns
     into nothing instead of letting .table-wrap scroll. Give them a floor so scrolling wins. */
  .portion-box input,.portion-box select{padding:5px 7px;font-size:13px;min-width:78px}
  .portion-box .lab{white-space:nowrap}
  .portion-unit{font-size:13px;color:var(--ink-2);font-family:var(--font-mono)}
  .packunit{font-family:var(--font-mono);color:var(--ink-2)}
  .conv-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .conv-row select{max-width:140px}
  .portion-eval{font-size:13px;color:var(--accent-2);font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  .inline-input.bad{border-color:var(--bad);color:var(--bad)}
  tbody tr.el-portion:hover{background:transparent}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
  .muted{color:var(--ink-3)}
  .unitchips{display:flex;flex-wrap:wrap;gap:8px}
  .chip.unitchip{padding:3px 4px 3px 11px;gap:1px}
  .chip.unitchip .iconbtn{padding:2px;color:var(--ink-3)}
  .chip.unitchip .iconbtn:hover{color:var(--bad);background:transparent}
  .convrows{display:flex;flex-direction:column;gap:8px}
  .convrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .convrow input{width:92px;text-align:right;padding:6px 8px;font-size:13px}
  .convrow select{min-width:92px;max-width:130px;padding:6px 8px;font-size:13px}
  .convrow .eq{font-family:var(--font-mono);color:var(--ink-3)}
  .convrow .iconbtn{color:var(--ink-3)}
  .convrow .iconbtn:hover{color:var(--bad);background:transparent}
  .convwarn{flex-basis:100%;font-size:12px;color:var(--warn);margin:-3px 0 3px}

  .empty{text-align:center;padding:48px 20px;color:var(--ink-3)}
  .empty h3{font-size:18px;color:var(--ink-2);margin-bottom:6px}
  .empty p{max-width:44ch;margin:0 auto 16px}

  dialog{border:1px solid var(--line-strong);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-pop);width:min(620px,94vw);max-height:90vh;overflow:visible}
  dialog::backdrop{background:rgba(15,20,17,.5);backdrop-filter:blur(2px)}
  .dlg-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .dlg-head h2{font-size:18px}
  .dlg-body{padding:18px 20px;overflow-y:auto;max-height:64vh}
  .dlg-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
  .dlg-foot .right{display:flex;gap:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid2.tight{grid-template-columns:1.6fr 1fr}

  .lines{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .line{display:grid;grid-template-columns:minmax(0,1fr) 80px minmax(84px,auto) minmax(64px,auto) auto;gap:8px;align-items:center}
  .line .lc{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);white-space:nowrap;text-align:right;min-width:64px}
  .line .u{font-size:12px;color:var(--ink-3);min-width:34px}
  .line .u-sel{font-size:12px;padding:5px 6px;color:var(--ink-2);width:100%;max-width:120px}
  .preview{margin-top:16px;border:1px dashed var(--line-strong);border-radius:10px;padding:14px 16px;background:var(--paper)}
  .preview .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 0}
  .preview .row .lab{color:var(--ink-2);font-size:13px}
  .preview .big{font-size:24px;font-family:var(--font-mono);font-weight:700;color:var(--brass)}
  .preview hr{border:0;border-top:1px solid var(--line);margin:8px 0}

  .switch{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);font-weight:500}
  .switch input{width:auto}
  .subcard{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--paper);margin-top:8px}
  .explain{font-size:13px;color:var(--ink-2);line-height:1.6}
  .explain code{font-family:var(--font-mono);background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:12.5px}
  .explain .sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:baseline;margin-right:3px}
  .danger-zone{border:1px solid var(--bad);border-radius:10px;padding:14px 16px;background:var(--bad-soft)}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:var(--shadow-pop);pointer-events:none;transition:opacity .22s,transform .22s;z-index:50;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--bad);color:#fff}

  @media (max-width:560px){
    .brand .sub{display:none}
    .line{grid-template-columns:minmax(0,1fr) 66px minmax(56px,auto) auto}
    .line .u,.line .u-sel{display:none}
    .grid2,.grid2.tight{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header>
  <div class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 3v18M4.5 3v5a1.5 1.5 0 003 0V3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18.5 3c-1.6 0-2.5 1.6-2.5 4.5S16.9 12 18.5 12 21 10.4 21 7.5 20.1 3 18.5 3zM18.5 12v9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>Plate&nbsp;&amp;&nbsp;Pour</h1>
        <div class="sub">Food &amp; drink costing</div>
      </div>
    </div>
    <div class="hactions">
      <button class="btn ghost" id="btn-import" title="Load a previously exported file">Import</button>
      <button class="btn" id="btn-export" title="Save a backup file you can load on another device">Export</button>
      <input type="file" id="file-input" accept="application/json,.json" hidden>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="recipes" aria-selected="true">Recipes</button>
    <button role="tab" data-tab="elements" aria-selected="false">Elements</button>
    <button role="tab" data-tab="categories" aria-selected="false">Categories</button>
    <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </nav>
</header>

<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="modal">
  <form method="dialog" id="modal-form">
    <div class="dlg-head"><h2 id="modal-title">Edit</h2>
      <button type="button" class="iconbtn" id="modal-x" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="dlg-body" id="modal-body"></div>
    <div class="dlg-foot">
      <div id="modal-foot-left"></div>
      <div class="right">
        <button type="button" class="btn ghost" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="modal-save">Save</button>
      </div>
    </div>
  </form>
</dialog>

<script>
(function(){
  "use strict";
  var LS_KEY = "plateandpour.v1";
  // Built-in Adversaire drive endpoint. When set, a brand-new visitor (empty browser)

  function usageCountElem(id){ var n=0; state.recipes.forEach(function(r){ r.lines.forEach(function(l){ if(l.elementId===id) n++; }); }); return n; }
  function usageCountCat(id){ var n=0; state.recipes.forEach(function(r){ if(r.categoryId===id) n++; }); return n; }
  function usageCountEcat(id){ var n=0; state.elements.forEach(function(e){ if(e.catId===id) n++; }); return n; }

  function money(n){ if(!isFinite(n)) n=0; return cur() + n.toFixed(2); }
  function pct(n){ return (n*100).toFixed(0) + "%"; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function ratioTxt(x){ return (Math.round(num(x)*100)/100).toString().replace(/\.00$/,"") + "×"; }
  function roundingSummary(rule){
    if(!rule || rule.mode==="none") return "no rounding";
    if(rule.mode==="charm") return "ends in ." + String(Math.round(num(rule.ending)*100)).padStart(2,"0");
    var word = rule.mode==="up"?"up":rule.mode==="down"?"down":"nearest";
    return word + " " + cur() + num(rule.increment).toFixed(2);
  }
  function unitOptions(current){
    var list = state.settings.units.slice();
    if(current && list.indexOf(current)<0) list.unshift(current);
    return list.map(function(u){ return '<option value="'+esc(u)+'"'+(u===current?" selected":"")+'>'+esc(u)+'</option>'; }).join("");
  }

  /* ---------------- Toast ---------------- */
  var toastEl = document.getElementById("toast"), toastT;
  function toast(msg, isErr){ toastEl.textContent = msg; toastEl.className = isErr ? "show err" : "show"; clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.className = ""; }, 2600); }

  /* ---------------- Icons ---------------- */
  var ic_edit='<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18 10l-4-4L4 16v4zM14 6l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ic_trash='<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M10 7V5h4v2M6 7l1 12h10l1-12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ic_dup='<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M4 15V5a1 1 0 011-1h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  var ic_x='<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  var ic_reset='<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 10.5A8 8 0 114 15" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ic_chev='<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ic_check='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="vertical-align:-3px"><path d="M5 12l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ic_cross='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="vertical-align:-3px"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
  var ic_sell='<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 4h7l9 9-7 7-9-9V4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/></svg>';
  function iconBtn(action,id,label,svg,danger){ return '<button class="iconbtn'+(danger?" danger":"")+'" data-act="'+action+'" data-id="'+id+'" title="'+label+'" aria-label="'+label+'">'+svg+'</button>'; }
  function stat(k,v){ return '<div class="stat"><div class="k">'+esc(k)+'</div><div class="v tnum">'+v+'</div></div>'; }
  function emptyCard(title,body,actId,actLabel){ return '<div class="card"><div class="empty"><h3>'+esc(title)+'</h3><p>'+esc(body)+'</p><button class="btn primary" id="'+actId+'">'+esc(actLabel)+'</button></div></div>'; }
  // A note you can type straight into, with an × to clear it. kind is "e" for an element, "r" for a recipe.
  // Always rendered, even when empty — an empty one is the place to click to add one.
  function noteLine(kind, id, notes){
    return '<div class="noteline">'
      + '<div class="rowsub note" contenteditable="plaintext-only" spellcheck="false" data-note="'+kind+'" data-id="'+esc(id)+'" data-ph="+ note" title="Click to edit this note">'+esc(notes||"")+'</div>'
      + '<button class="notedel" data-act="del-note" data-nkind="'+kind+'" data-id="'+esc(id)+'" title="Remove note" aria-label="Remove note"'+(notes?"":" hidden")+'>'+ic_x+'</button>'
    + '</div>';
  }

  /* ---------------- Rendering ---------------- */
  var view = document.getElementById("view");
  function render(){
    bustFactors();   // conversions may have moved since the last paint; every factor is worked out fresh from here
    document.querySelectorAll('nav.tabs button').forEach(function(b){ b.setAttribute("aria-selected", b.dataset.tab===ui.tab ? "true":"false"); });
    if(ui.tab==="recipes") renderRecipes();
    else if(ui.tab==="elements") renderElements();
    else if(ui.tab==="categories") renderCategories();
    else renderSettings();
    updateExportState();
  }
  function updateExportState(){
    var btn = document.getElementById("btn-export");
    if(!btn) return;
    var readOnly = state.settings.driveSync && ui.loadedFrom==="snapshot";
    btn.disabled = readOnly;
    btn.title = readOnly
      ? "Read-only on this network — the live drive isn’t reachable here. Make edits from a network where it works."
      : (state.settings.driveSync ? "Save changes to the shared drive" : "Save a backup file to this device");
  }

  function markupCell(r,m){
    var val = m.markupMode==="inherited" ? "" : String(round2(m.markup));
    var cls = m.markupMode==="override" ? " ov-red" : (m.markupMode==="derived" ? " ov-blue" : "");
    return '<div class="ovcell">'
      + '<input class="ovinput'+cls+'" data-rmarkup="'+r.id+'" type="number" step="any" min="0" inputmode="decimal" value="'+val+'" placeholder="'+round2(m.inherited)+'" aria-label="Markup (multiplier)">'
      + '<button class="ovreset" data-act="reset-markup" data-id="'+r.id+'" title="Reset to category markup" aria-label="Reset markup"'+(m.markupMode==="override"?"":" hidden")+'>'+ic_reset+'</button>'
      + '</div>';
  }
  function priceCell(r,m){
    var cls = m.priceMode==="override" ? " ov-red" : "";
    return '<div class="ovcell">'
      + '<span class="pre">'+esc(cur())+'</span>'
      + '<input class="ovinput price'+cls+'" data-rprice="'+r.id+'" type="number" step="any" min="0" inputmode="decimal" value="'+round2(m.price)+'" aria-label="Price">'
      + '<button class="ovreset" data-act="reset-price" data-id="'+r.id+'" title="Reset to calculated price" aria-label="Reset price"'+(m.priceMode==="override"?"":" hidden")+'>'+ic_reset+'</button>'
      + '</div>';
  }
  function desiredCell(r,m){
    var val = m.desiredMode==="override" ? String(round2(m.desired)) : "";
    var cls = m.desiredMode==="override" ? " ov-red" : "";
    return '<div class="ovcell">'
      + '<input class="ovinput'+cls+'" data-rdesired="'+r.id+'" type="number" step="any" min="0" max="100" inputmode="decimal" value="'+val+'" placeholder="'+round2(m.inhMargin)+'" aria-label="Desired margin percent">'
      + '<span class="suf">%</span>'
      + '<button class="ovreset" data-act="reset-desired" data-id="'+r.id+'" title="Reset to category" aria-label="Reset desired margin"'+(m.desiredMode==="override"?"":" hidden")+'>'+ic_reset+'</button>'
      + '</div>';
  }
  function marginInner(m){
    if(!(m.cost>0 && m.price>0)) return '<span class="muted">—</span>';
    var ic = m.meets ? '<span class="mark-ok" title="Meets desired margin">'+ic_check+'</span>' : '<span class="mark-no" title="Below desired margin">'+ic_cross+'</span>';
    return '<span class="tnum">'+pct(gp(m.price,m.cost))+'</span> '+ic;
  }
  function recipeRow(r){
    var m = computeRecipe(r);
    return '<tr data-rid="'+r.id+'">'
      + '<td class="name-cell rname" data-act="edit-recipe" data-id="'+r.id+'" title="Click to edit">'+esc(r.name||"Untitled")+'<div class="rowsub">'+r.lines.length+' element'+(r.lines.length===1?"":"s")+'</div>'+noteLine("r", r.id, r.notes)+'</td>'
      + '<td class="num cost cell-cost">'+money(m.cost)+'</td>'
      + '<td class="num">'+markupCell(r,m)+'</td>'
      + '<td class="num">'+priceCell(r,m)+'</td>'
      + '<td class="num cell-margin">'+marginInner(m)+'</td>'
      + '<td class="num">'+desiredCell(r,m)+'</td>'
      + '<td><div class="rowactions">'+iconBtn("edit-recipe",r.id,"Edit",ic_edit)+iconBtn("dup-recipe",r.id,"Duplicate",ic_dup)+iconBtn("del-recipe",r.id,"Delete",ic_trash,true)+'</div></td>'
      + '</tr>';
  }
  function sortTh(label,col,numeric){
    var active = ui.sort.col===col;
    var arrow = active ? '<span class="sortarrow">'+(ui.sort.dir>0?"▲":"▼")+'</span>' : '';
    return '<th class="'+(numeric?"num ":"")+'sortable" data-sortcol="'+col+'">'+esc(label)+arrow+'</th>';
  }
  function sortRecipes(rs){
    var col=ui.sort.col, dir=ui.sort.dir;
    return rs.slice().sort(function(a,b){
      if(col==="name"){ var an=(a.name||"").toLowerCase(), bn=(b.name||"").toLowerCase(); return an<bn?-dir:an>bn?dir:0; }
      var ma=computeRecipe(a), mb=computeRecipe(b), av, bv;
      if(col==="cost"){ av=ma.cost; bv=mb.cost; }
      else if(col==="markup"){ av=ma.markup; bv=mb.markup; }
      else if(col==="price"){ av=ma.price; bv=mb.price; }
      else if(col==="margin"){ av=ma.cost>0?ma.marginPct:-1; bv=mb.cost>0?mb.marginPct:-1; }
      else if(col==="desired"){ av=ma.desired; bv=mb.desired; }
      else { av=0; bv=0; }
      return (av-bv)*dir;
    });
  }
  function groupBlock(cid, name, markup, rs){
    var collapsed = !!ui.collapsed[cid];
    var rows = sortRecipes(rs).map(recipeRow).join("");
    return '<div class="group">'
      + '<button class="grouphead" data-act="toggle-group" data-id="'+esc(cid)+'" aria-expanded="'+(collapsed?"false":"true")+'">'
        + '<span class="chev">'+ic_chev+'</span><h3>'+esc(name)+'</h3>'
        + '<span class="gcount">'+rs.length+' recipe'+(rs.length===1?"":"s")+'</span>'
        + '<span class="gmarkup">'+ratioTxt(markup)+' default</span>'
      + '</button>'
      + '<div class="groupbody"'+(collapsed?" hidden":"")+'>'
        + '<div class="table-wrap"><table><thead><tr>'
          + sortTh("Recipe","name",false)+sortTh("Cost","cost",true)+sortTh("Markup","markup",true)
          + sortTh("Price","price",true)+sortTh("Margin","margin",true)+sortTh("Desired","desired",true)+'<th></th>'
          + '</tr></thead><tbody>'+rows+'</tbody></table></div>'
      + '</div></div>';
  }
  function renderRecipes(){
    var n = state.recipes.length;
    // The legend sits above the table it explains — but says nothing until there is one.
    var legend = n ? '<div class="hint">Type in a <strong>Markup</strong>, <strong>Price</strong> or <strong>Desired</strong> box to override it. '
      + '<span style="color:var(--bad);font-weight:600">Red</span> = a manual override (click ↺ to reset); '
      + 'a <span style="color:var(--info);font-weight:600">blue</span> markup is back-calculated from a price you set. '
      + 'The Margin column shows a <span style="color:var(--good);font-weight:600">✓</span> at or above the desired margin, <span style="color:var(--bad);font-weight:600">✗</span> below. Click any column header to sort.</div>' : '';
    var html = '<div class="sectionhead"><div><h2>Recipes</h2>'+legend+'</div><button class="btn primary" id="add-recipe">+ New recipe</button></div>';

    if(!n){
      html += emptyCard("No recipes yet","Create your first recipe to see its cost and a suggested sell price.",
        state.elements.length? "add-recipe-2":"go-elements", state.elements.length? "+ New recipe":"Add elements first");
      view.innerHTML = html; return;
    }
    var groups = "";
    state.categories.forEach(function(c){
      var rs = state.recipes.filter(function(r){ return r.categoryId===c.id; });
      if(rs.length) groups += groupBlock(c.id, c.name, num(c.ratio), rs);
    });
    var uncat = state.recipes.filter(function(r){ return !cat(r.categoryId); });
    if(uncat.length) groups += groupBlock("__uncat__","Uncategorized", num(state.settings.defaultRatio), uncat);
    html += groups;
    view.innerHTML = html;
  }

  function earrow(col){ return ui.esort.col===col ? '<span class="sortarrow">'+(ui.esort.dir>0?"▲":"▼")+'</span>' : ''; }
  function sortElements(list){
    var col=ui.esort.col, dir=ui.esort.dir;
    return list.slice().sort(function(a,b){
      if(col==="used") return (usageCountElem(a.id)-usageCountElem(b.id))*dir;
      var av,bv;
      if(col==="modified"){ av=a.modified||""; bv=b.modified||""; }
      else { av=(a.name||"").toLowerCase(); bv=(b.name||"").toLowerCase(); }
      return av<bv?-dir:av>bv?dir:0;
    });
  }
  function elementRow(e){
    return '<tr data-id="'+e.id+'" class="el-main">'
      + '<td class="name-cell rname" data-act="edit-elem" data-id="'+e.id+'" title="Click to edit">'+esc(e.name||"(unnamed)")
        + noteLine("e", e.id, e.notes)+'</td>'
      + '<td class="num"><input class="inline-input tnum" data-f="cost" type="number" step="any" min="0" inputmode="decimal" value="'+esc(e.cost)+'" style="max-width:100px;text-align:right"></td>'
      + '<td class="num"><input class="inline-input tnum" data-f="size" type="number" step="any" min="0" inputmode="decimal" value="'+esc(e.size)+'" style="max-width:90px;text-align:right"></td>'
      + '<td><select class="inline-input" data-f="unit" style="min-width:100px;max-width:100px">'+unitOptions(e.unit)+'</select></td>'
      + '<td class="num money cell-portioncost">'+portionCostCell(e)+'</td>'
      + '<td class="muted cell-modified" style="font-size:12.5px;white-space:nowrap">'+esc(e.modified||"")+'</td>'
      + '<td class="num tnum muted">'+usageCountElem(e.id)+'</td>'
      + '<td><div class="rowactions">'+iconBtn("edit-elem", e.id, "Edit", ic_edit)+iconBtn("sell-elem", e.id, "Sell directly (create a recipe of just this)", ic_sell)+iconBtn("del-elem", e.id, "Delete", ic_trash, true)+'</div></td></tr>'
      + '<tr data-id="'+e.id+'" class="el-portion"><td></td><td colspan="3"><div class="portion-line">'
        + '<label class="switch"><input type="checkbox" data-f="hasPortion"'+(hasPortion(e)?" checked":"")+'>Define portion</label>'
        + (hasPortion(e)
          ? portionBox(e)
          : '<span class="muted" style="font-size:12.5px">Counted in '+esc(elemUnit(e))+' — recipes use that unit.</span>')
        + '</div></td><td></td><td></td><td></td><td></td></tr>';
  }
  // Two lines in one box: the unit transfer that spells the pack unit out in a smaller one, then the
  // portion itself — written in either of those two units.
  function portionBox(e){
    var pack = esc(elemUnit(e)), praw = portionRaw(e);
    return '<div class="portion-box">'
      + '<span class="lab"><span class="packunit">'+pack+'</span> =</span>'
      + '<input class="inline-input tnum" data-f="convExpr" type="text" inputmode="text" autocomplete="off" spellcheck="false" value="'+esc(convRaw(e))+'" title="What one '+pack+' holds — a number or an equation. Leave empty for no transfer." placeholder="e.g. 750" style="width:104px;text-align:right">'
      + '<select class="inline-input" data-f="convUnit" aria-label="Transfer unit" style="max-width:110px">'+convUnitOptions(e)+'</select>'
      + '<span class="portion-eval eval-conv">'+esc(convEvalText(e))+'</span>'
      + '<span class="lab">One portion:</span>'
      + '<input class="inline-input tnum" data-f="portionExpr" type="text" inputmode="text" autocomplete="off" spellcheck="false" value="'+esc(praw)+'" title="A number or an equation — e.g. 750/25 or (2+3)*4" placeholder="e.g. 750/25" style="width:104px;text-align:right">'
      + portionUnitControl(e)
      + '<span class="portion-eval eval-portion">'+esc(portionEvalText(e))+'</span>'
    + '</div>';
  }
  // A single choice stays plain text, exactly as it read before there was anything to choose.
  function portionUnitControl(e){
    var opts = portionUnitOptions(e), cur = portionUnitOf(e);
    if(opts.length<2) return '<span class="portion-unit">'+esc(cur)+'</span>';
    return '<select class="inline-input" data-f="portionUnit" aria-label="Portion unit" style="max-width:110px">'
      + opts.map(function(u){ return '<option value="'+esc(u)+'"'+(u===cur?" selected":"")+'>'+esc(u)+'</option>'; }).join("")
      + '</select>';
  }
  // The pack unit itself and the generic "portion" are the other two ways to count an element — offering
  // either as the transfer unit would just collide with them.
  function convUnitOptions(e){
    var cur = convUnit(e) || "";
    var list = state.settings.units.filter(function(u){ return u!==elemUnit(e) && u!=="portion"; });
    if(cur && list.indexOf(cur)<0) list.unshift(cur);
    return '<option value=""'+(cur?"":" selected")+'>—</option>'
      + list.map(function(u){ return '<option value="'+esc(u)+'"'+(u===cur?" selected":"")+'>'+esc(u)+'</option>'; }).join("");
  }
  // The portion-cost column falls back to the unit cost when the element has no portion.
  function portionCostCell(e){ return money(portionCost(e))+'<span class="muted" style="font-size:11px">/'+esc(hasPortion(e)?"portion":elemUnit(e))+'</span>'; }
  // What the "One portion" field shows: the stored equation if there is one, otherwise the plain number.
  function portionRaw(e){ return (e && e.portionExpr!=null && e.portionExpr!=="") ? e.portionExpr : String(e?num(e.portion):0); }
  // Same for the transfer, except that nothing at all means no transfer.
  function convRaw(e){
    if(!e) return "";
    if(e.convExpr!=null && e.convExpr!=="") return e.convExpr;
    return (e.convQty==null || num(e.convQty)===0) ? "" : String(num(e.convQty));
  }
  // An equation is worth showing the result of. A portion written in the transfer unit isn't converted
  // for display — the dropdown beside it already says what the number means.
  function portionEvalText(e){ return (portionUnitOf(e)===elemUnit(e) && isExpr(portionRaw(e))) ? "= "+fmtNum(num(e.portion)) : ""; }
  function convEvalText(e){ return (hasConv(e) && isExpr(convRaw(e))) ? "= "+fmtNum(convQty(e)) : ""; }
  function elementGroupBlock(gid, name, list){
    var collapsed = !!ui.collapsed[gid];
    var rows = sortElements(list).map(elementRow).join("");
    return '<div class="group">'
      + '<button class="grouphead" data-act="toggle-group" data-id="'+esc(gid)+'" aria-expanded="'+(collapsed?"false":"true")+'">'
        + '<span class="chev">'+ic_chev+'</span><h3>'+esc(name)+'</h3>'
        + '<span class="gcount">'+list.length+' element'+(list.length===1?"":"s")+'</span>'
      + '</button>'
      + '<div class="groupbody"'+(collapsed?" hidden":"")+'>'
        + '<div class="table-wrap"><table><thead><tr>'
          + '<th class="sortable" style="min-width:200px" data-esortcol="name">Name'+earrow("name")+'</th><th class="num">Pack cost</th><th class="num">Pack size</th><th>Unit</th>'
          + '<th class="num">Portion cost</th><th class="sortable" data-esortcol="modified">Last modified'+earrow("modified")+'</th><th class="num sortable" data-esortcol="used">Used in'+earrow("used")+'</th><th></th>'
          + '</tr></thead><tbody>'+rows+'</tbody></table></div>'
      + '</div></div>';
  }
  function renderElements(){
    var html = '<div class="sectionhead"><div><h2>Elements</h2>'
      + '<div class="hint">The raw things you buy — food or drink. Enter the pack size you purchase and its price; the unit cost is worked out for you. Grouped by element category — manage those in the Categories tab.</div></div>'
      + '<button class="btn primary" id="add-elem">+ New element</button></div>';
    if(!state.elements.length){
      html += emptyCard("No elements yet","Add the things you buy — a 750 ml bottle of gin, a case of buns, a kilo of flour — with their pack size and price.","add-elem-2","+ New element");
      view.innerHTML = html; return;
    }
    var groups = "";
    state.elementCategories.forEach(function(c){
      var list = state.elements.filter(function(e){ return e.catId===c.id; });
      if(list.length) groups += elementGroupBlock("el:"+c.id, c.name, list);
    });
    var uncat = state.elements.filter(function(e){ return !ecat(e.catId); });
    if(uncat.length) groups += elementGroupBlock("el:__uncat__", "Uncategorized", uncat);
    html += groups;
    html += '<p class="hint" style="margin-top:12px"><strong>Portion cost</strong> = pack cost × (one portion ÷ pack size). The <em>unit transfer</em> spells the pack unit out in a smaller one — <em>bouteille = 750 ml</em> — so a portion can be written as 30 ml instead of 30/750, and recipes can count in ml too. Leave <em>Define portion</em> off for things you buy and use in the same unit — the column then shows the cost of one unit, and recipes count them in that unit. Any edit stamps <em>Last modified</em>. The ✎ editor holds name, notes &amp; category; the tag icon sells an element on its own. Click a column header to sort every section. Manage units — and the conversions between them, which every unit dropdown here then offers — in Settings.</p>';
    view.innerHTML = html;
  }

  function renderCategories(){
    var html = '<div class="sectionhead"><div><h2>Categories</h2>'
      + '<div class="hint">Two kinds of grouping: <strong>recipe categories</strong> set the default markup for the menu items in them, and <strong>element categories</strong> just sort your raw elements into collapsible sections.</div></div></div>';

    // ---- Recipe categories ----
    html += '<div class="card">'
      + '<div class="cardhead"><h3>Recipe categories</h3><button class="btn sm" id="add-cat">+ New category</button></div>';
    if(!state.categories.length){
      html += '<div class="empty" style="padding:20px 8px"><p>Group your recipes — Cocktails, Beer, Kitchen — and give each a default markup.</p></div>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr>'
        + '<th style="min-width:200px">Category</th><th class="num">Default markup</th><th class="num">Desired margin</th><th class="num">Recipes</th><th></th></tr></thead><tbody>';
      state.categories.forEach(function(c){
        html += '<tr data-cid="'+c.id+'">'
          + '<td><input class="inline-input" data-f="name" value="'+esc(c.name)+'" placeholder="Category name"></td>'
          + '<td class="num"><input class="inline-input tnum" data-f="ratio" type="number" step="any" min="0" value="'+esc(c.ratio)+'" style="max-width:80px;text-align:right"></td>'
          + '<td class="num"><div class="ovcell" style="justify-content:flex-end"><input class="inline-input tnum" data-f="desiredMargin" type="number" step="any" min="0" max="100" value="'+esc(c.desiredMargin)+'" style="max-width:66px;text-align:right"><span class="suf">%</span></div></td>'
          + '<td class="num tnum muted">'+usageCountCat(c.id)+'</td>'
          + '<td><div class="rowactions">'+iconBtn("del-cat", c.id, "Delete", ic_trash, true)+'</div></td></tr>';
      });

  /* ---------------- Unit conversion table (Settings) ---------------- */
  // One row: [amount] [unit] = [amount] [unit], the two dropdowns never on the same unit.
  function conversionRow(c, ix){
    var msg = conversionWarning(c, ix);
    return '<div class="convrow" data-cvid="'+esc(c.id)+'">'
      + convQtyInput(c, "fromQty") + '<select class="inline-input" data-cf="fromUnit" aria-label="Unit">'+convUnitList(c.fromUnit, c.toUnit)+'</select>'
      + '<span class="eq">=</span>'
      + convQtyInput(c, "toQty") + '<select class="inline-input" data-cf="toUnit" aria-label="Unit">'+convUnitList(c.toUnit, c.fromUnit)+'</select>'
      + '<button class="iconbtn" data-act="del-conv" data-id="'+esc(c.id)+'" title="Remove this conversion" aria-label="Remove this conversion">'+ic_x+'</button>'
      + '<div class="convwarn"'+(msg?"":" hidden")+'>'+esc(msg)+'</div>'
    + '</div>';
  }
  function convQtyInput(c, f){
    var raw = (c[f]==null || c[f]==="") ? "" : String(c[f]), bad = raw!=="" && !(num(raw)>0);
    return '<input class="inline-input tnum'+(bad?" bad":"")+'" data-cf="'+f+'" type="number" step="any" min="0" inputmode="decimal" value="'+esc(raw)+'" aria-label="Amount">';
  }
  // The two sides can never name the same unit, so each dropdown leaves the other one's pick out.
  function convUnitList(current, banned){
    var list = convertible().filter(function(u){ return u!==banned; });
    if(current && list.indexOf(current)<0) list.unshift(current);
    return list.map(function(u){ return '<option value="'+esc(u)+'"'+(u===current?" selected":"")+'>'+esc(u)+'</option>'; }).join("");
  }
  // Rows are read top down and the first path found wins, so a row the ones above it already answer —
  // differently — is worth saying out loud rather than quietly ignoring.
  function conversionWarning(c, ix){
    if(!c.fromUnit || !c.toUnit || c.fromUnit===c.toUnit) return "Pick two different units.";
    if(!(num(c.fromQty)>0) || !(num(c.toQty)>0)) return "Fill both amounts in for this one to count.";
    var above = unitFactor(c.fromUnit, c.toUnit, null, convList().slice(0, ix));
    if(!isFinite(above)) return "";
    var mine = num(c.toQty)/num(c.fromQty);
    if(Math.abs(above-mine) <= Math.abs(mine)*1e-6) return "";
    return "The rows above already make 1 "+c.fromUnit+" = "+fmtNum(above)+" "+c.toUnit+", and that one wins.";
  }
  function findConv(id){ var l=convList(); for(var i=0;i<l.length;i++) if(l[i].id===id) return l[i]; return null; }
  function convSnapshot(){ return convList().map(function(c){ return {id:c.id, fromQty:c.fromQty, fromUnit:c.fromUnit, toQty:c.toQty, toUnit:c.toUnit}; }); }
  function addConversion(){
    var u = convertible();
    if(u.length<2){ toast("Add a second unit first.", true); return; }
    // The amounts start empty: a row is inert until it has been filled in, so adding one can't move a price.
    state.settings.conversions = convList().concat([{ id:uid("cv"), fromQty:1, fromUnit:u[0], toQty:null, toUnit:u[1] }]);
    bustFactors(); save(); render();
    var rows = view.querySelectorAll('.convrow [data-cf="toQty"]');
    if(rows.length) rows[rows.length-1].focus();
  }
  // Amount edits only land on commit — halfway through typing "1000" the table would say 1 L = 1 ml,
  // and every recipe written in litres would be re-expressed against that.
  function convEdited(inp, ev){
    if(ev.type!=="change") return;
    var row = inp.closest("[data-cvid]"); if(!row) return;
    var c = findConv(row.dataset.cvid); if(!c) return;
    var was = convSnapshot(), f = inp.dataset.cf, isQty = (f==="fromQty" || f==="toQty");
    if(isQty) c[f] = inp.value.trim()==="" ? null : num(inp.value);
    else {
      c[f] = inp.value;
      var other = (f==="fromUnit") ? "toUnit" : "fromUnit";   // never both sides on the same unit
      if(c[other]===c[f]) c[other] = settingsUnits().filter(function(u){ return u!==c[f]; })[0] || "";
    }
    bustFactors(); reconcileUnits(was); save();
    // An amount edit leaves the row exactly as it is on screen, so only the warnings need redrawing —
    // repainting the whole tab under a click would swallow it. A unit edit reshuffles both dropdowns.
    if(isQty) paintConvState(); else render();
  }
  function paintConvState(){
    convList().forEach(function(c, ix){
      var row = view.querySelector('.convrow[data-cvid="'+c.id+'"]'); if(!row) return;
      var w = row.querySelector(".convwarn"), msg = conversionWarning(c, ix);
      if(w){ w.textContent = msg; w.hidden = !msg; }
      Array.prototype.forEach.call(row.querySelectorAll('input[data-cf]'), function(el){
        var raw = el.value.trim();
        el.classList.toggle("bad", raw!=="" && !(num(raw)>0));
      });
    });
  }

  /* ---------------- Rounding editor ---------------- */
  function roundingFields(p, rule){
    rule = rule || {mode:"none"};
    var m = rule.mode||"none";
    function opt(v,t){ return '<option value="'+v+'"'+(m===v?" selected":"")+'>'+t+'</option>'; }
    var incVal = num(rule.increment)||0.25, endVal = (rule.ending!=null)? num(rule.ending) : 0.95;
    return '<div class="subcard"><div class="grid2 tight">'
      + '<label class="field">Rule<select id="'+p+'-mode">'
          + opt("charm","Charm price (.95 / .99)")+opt("nearest","Nearest increment")+opt("up","Round up to increment")+opt("down","Round down to increment")+opt("none","No rounding")
        + '</select></label>'
      + '<label class="field" id="'+p+'-inc-wrap">Increment<select id="'+p+'-inc">'+incOpt(0.05,incVal)+incOpt(0.10,incVal)+incOpt(0.25,incVal)+incOpt(0.50,incVal)+incOpt(1.00,incVal)+'</select></label>'
      + '<label class="field" id="'+p+'-end-wrap">Ending<select id="'+p+'-end">'+endOpt(0.95,endVal)+endOpt(0.99,endVal)+endOpt(0.50,endVal)+endOpt(0.00,endVal)+endOpt(0.49,endVal)+'</select></label>'
      + '</div><div class="hint" style="margin-top:10px" id="'+p+'-preview"></div></div>';
  }
  function incOpt(v,c){ return '<option value="'+v+'"'+(Math.abs(v-c)<1e-6?" selected":"")+'>'+cur0(v)+'</option>'; }
  function endOpt(v,c){ return '<option value="'+v+'"'+(Math.abs(v-c)<1e-6?" selected":"")+'>.'+String(Math.round(v*100)).padStart(2,"0")+'</option>'; }
  function cur0(v){ return (state.settings.currency||"$") + v.toFixed(2); }
  function readRounding(p){ return { mode:document.getElementById(p+"-mode").value, increment:num(document.getElementById(p+"-inc").value), ending:num(document.getElementById(p+"-end").value) }; }
  function wireRounding(p){
    var modeEl = document.getElementById(p+"-mode"); if(!modeEl) return;
    function upd(){
      var mode = modeEl.value, isCharm = mode==="charm", isNone = mode==="none";
      document.getElementById(p+"-end-wrap").style.display = isCharm ? "" : "none";
      document.getElementById(p+"-inc-wrap").style.display = (isCharm||isNone) ? "none" : "";
      var prev = document.getElementById(p+"-preview");
      if(isNone){ prev.textContent = "Prices shown to the cent, unrounded."; return; }
      var rule = readRounding(p);
      prev.innerHTML = "Example: " + [8.13,11.40].map(function(x){ return money(x)+" → <strong>"+money(roundPrice(x,rule))+"</strong>"; }).join(" · ");
    }
    modeEl.addEventListener("change", upd);
    var i=document.getElementById(p+"-inc"), e=document.getElementById(p+"-end");
    if(i) i.addEventListener("change", upd); if(e) e.addEventListener("change", upd);
    upd();
  }

  /* ---------------- Recipe editor (structure only; markup/price edited inline) ---------------- */
  function editRecipe(r){
    var isNew = !r;
    if(state.elements.length===0){ toast("Add some elements first.", true); ui.tab="elements"; render(); return; }
    r = r || { id:uid("r"), name:"", categoryId: state.categories[0]?state.categories[0].id:null, ratio:null, priceOverride:null, lines:[] };
    var draft = JSON.parse(JSON.stringify(r));
    if(draft.lines.length===0) draft.lines.push({elementId:state.elements[0].id, amount:0});
    draft.lines.forEach(function(l){ if(l.unit==null || lineUnitOptions(elem(l.elementId)).indexOf(l.unit)<0) l.unit = defaultLineUnit(l); });

    function body(){
      var catOpts = '<option value="">Uncategorized</option>' + state.categories.map(function(c){ return '<option value="'+c.id+'"'+(draft.categoryId===c.id?" selected":"")+'>'+esc(c.name)+' ('+ratioTxt(c.ratio)+')</option>'; }).join("");
      return '<div class="grid2 tight">'
        + '<label class="field">Recipe name<input id="r-name" value="'+esc(draft.name)+'" placeholder="e.g. Negroni"></label>'
        + '<label class="field">Category<select id="r-cat">'+catOpts+'</select></label></div>'
        + '<label class="field" style="margin-top:14px">Notes <span style="font-weight:400;text-transform:none;letter-spacing:normal;color:var(--ink-3)">— optional, shown under the recipe name</span><input id="r-notes" value="'+esc(draft.notes||"")+'" placeholder="e.g. seasonal; ask before 86ing"></label>'
        + '<div class="field" style="margin:18px 0 0">Elements</div><div class="lines" id="r-lines"></div>'
        + '<div style="margin-top:10px"><button type="button" class="btn sm" id="r-addline">+ Add element</button></div>'
        + '<div class="preview" id="r-preview"></div>';
    }
    function lineRow(l, idx){
      var opts = state.elements.map(function(e){ return '<option value="'+e.id+'"'+(l.elementId===e.id?" selected":"")+'>'+esc(e.name)+'</option>'; }).join("");
      var e = elem(l.elementId);
      var uOpts = lineUnitOptions(e), cur = l.unit||"portion";
      var unitCtrl = uOpts.length>1
        ? '<select data-lf="unit" class="u-sel" aria-label="Unit">'+uOpts.map(function(u){ return '<option value="'+esc(u)+'"'+(cur===u?" selected":"")+'>'+esc(u)+'</option>'; }).join("")+'</select>'
        : '<span class="u">'+esc(uOpts[0])+'</span>';
      return '<div class="line" data-idx="'+idx+'">'
        + '<select data-lf="elementId">'+opts+'</select>'
        + '<input data-lf="amount" type="number" step="any" min="0" inputmode="decimal" value="'+esc(l.amount)+'" aria-label="Amount">'
        + unitCtrl + '<span class="lc">'+money(lineCost(l))+'</span>'
        + '<button type="button" class="iconbtn danger" data-lrem="'+idx+'" aria-label="Remove">'+ic_trash+'</button></div>';
    }
    function paintLines(){
      var box = document.getElementById("r-lines");
      box.innerHTML = draft.lines.map(function(l,idx){ return lineRow(l,idx); }).join("");
      box.querySelectorAll(".line").forEach(function(row){
        var idx = +row.dataset.idx;
        row.querySelector('[data-lf="elementId"]').addEventListener("change", function(ev){ draft.lines[idx].elementId=ev.target.value; draft.lines[idx].unit=defaultLineUnit(draft.lines[idx]); paintLines(); paintPreview(); });
        row.querySelector('[data-lf="amount"]').addEventListener("input", function(ev){ draft.lines[idx].amount=ev.target.value; row.querySelector(".lc").textContent=money(lineCost(draft.lines[idx])); paintPreview(); });
        var us=row.querySelector('[data-lf="unit"]'); if(us) us.addEventListener("change", function(ev){ draft.lines[idx].unit=ev.target.value; row.querySelector(".lc").textContent=money(lineCost(draft.lines[idx])); paintPreview(); });
        row.querySelector('[data-lrem]').addEventListener("click", function(){ draft.lines.splice(idx,1); if(!draft.lines.length) draft.lines.push({elementId:state.elements[0].id,amount:0,unit:"portion"}); paintLines(); paintPreview(); });
      });
    }
    function readTop(){ draft.name = document.getElementById("r-name").value; draft.categoryId = document.getElementById("r-cat").value || null; draft.notes = document.getElementById("r-notes").value; }
    function paintPreview(){
      readTop();
      var m = computeRecipe(draft);
      var note = m.markupMode==="derived" ? " (from price)" : (m.markupMode==="override" ? " (override)" : "");
      document.getElementById("r-preview").innerHTML =
          '<div class="row"><span class="lab">Element cost</span><span class="money">'+money(m.cost)+'</span></div>'
        + '<div class="row"><span class="lab">Markup'+note+'</span><span class="money">'+ratioTxt(m.markup)+'</span></div>'
        + '<hr><div class="row"><span class="lab" style="font-weight:600;color:var(--ink)">Suggested price</span><span class="big">'+money(m.price)+'</span></div>'
        + '<div class="row"><span class="lab">Margin</span><span class="money">'+(m.cost>0?pct(gp(m.price,m.cost)):"—")+'</span></div>';
    }
    openModal(isNew? "New recipe":"Edit recipe", body(), function(){
      readTop();
      if(!draft.name.trim()){ toast("Give the recipe a name.", true); return false; }
      draft.lines = draft.lines.filter(function(l){ return num(l.amount)>0; });
      var idx = state.recipes.map(function(x){return x.id;}).indexOf(draft.id);
      if(idx>=0) state.recipes[idx]=draft; else state.recipes.push(draft);
      toast(isNew?"Recipe added":"Recipe saved");
    });
    document.getElementById("r-cat").addEventListener("change", paintPreview);
    document.getElementById("r-addline").addEventListener("click", function(){ draft.lines.push({elementId:state.elements[0].id,amount:0,unit:"portion"}); paintLines(); paintPreview(); });
    paintLines(); paintPreview();
  }

  /* ---------------- Import / Export ---------------- */
  function driveUrl(){ return ((state.settings.driveUrl||"").trim()) || DEFAULT_DRIVE_URL; }
  function driveEnabled(){ return !!(state.settings.driveSync && driveUrl()); }
  function isDataset(obj){ return obj && obj.settings && (Array.isArray(obj.elements)||Array.isArray(obj.ingredients)) && Array.isArray(obj.recipes) && Array.isArray(obj.categories); }
  function applyImported(obj){
    if(!isDataset(obj)) throw new Error("Not a valid Plate & Pour dataset.");
    var ds = state.settings.driveSync, du = state.settings.driveUrl;   // Drive config is device-local, never overwritten by loaded data
    state = migrate(obj);
    state.settings.driveSync = ds; state.settings.driveUrl = du;
    save(); render();
  }

  function doExport(){
    if(state.settings.driveSync && ui.loadedFrom==="snapshot"){ toast("Read-only on this network — can’t save to the drive here.", true); return; }
    if(driveEnabled()){ drivePush(); return; }
    var data = JSON.stringify(state, null, 2), name = "plate-and-pour-backup.json";
    if(window.claude && window.claude.downloads){
      window.claude.downloads.save({ filename:name, data:data }).then(function(){ toast("Backup saved"); })
        .catch(function(err){ if(err && err.code==="declined") return; fallbackDownload(data, name); });
    } else { fallbackDownload(data, name); }
  }
  function fallbackDownload(data, name){
    try{
      var blob = new Blob([data], {type:"application/json"}), url = URL.createObjectURL(blob);
      var a = document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 100);
      toast("Backup downloaded");
    }catch(e){ toast("Export failed: "+e.message, true); }
  }
  var fileInput = document.getElementById("file-input");
  function doImport(){ if(state.settings.driveSync){ syncShared({manual:true}); return; } fileInput.value=""; fileInput.click(); }
  fileInput.addEventListener("change", function(){
    var f = fileInput.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){ try{ applyImported(JSON.parse(rd.result)); toast("Data imported"); }catch(e){ toast("Import failed: "+e.message, true); } };
    rd.readAsText(f);
  });

  /* ---- Adversaire drive sync (via an Apps Script web app URL) ---- */
  function driveFetch(o){
    o = o || {};
    var url = driveUrl();
    if(!url){ if(o.errMsg!==false) toast("Set the Drive URL in Settings first.", true); return Promise.reject(new Error("no url")); }
    return fetch(url, {method:"GET"}).then(function(res){ if(!res.ok) throw new Error("HTTP "+res.status); return res.text(); })
      .then(function(txt){
        var obj = JSON.parse(txt);
        if(obj && obj.data && isDataset(obj.data)) obj = obj.data;   // tolerate a {ok,data} wrapper
        applyImported(obj);
        if(o.okMsg!==false) toast("Loaded from Adversaire drive");
      })
      .catch(function(err){ if(o.errMsg!==false) toast("Drive fetch failed: "+((err&&err.message)||err), true); throw err; });
  }
  // Same-origin snapshot (committed to the GitHub Pages repo, refreshed from Drive by a scheduled job).
  // Works even on networks that block Google, because it's served from the same site as the app.
  function snapshotFetch(){
    return fetch("data.json?ts="+Date.now(), {cache:"no-store"}).then(function(res){ if(!res.ok) throw new Error("HTTP "+res.status); return res.json(); }).then(function(obj){ applyImported(obj); });
  }
  // Load shared data: try the live Adversaire drive first, then fall back to the same-origin snapshot.
  function syncShared(opts){
    opts = opts || {};
    return driveFetch({okMsg:false, errMsg:false})
      .then(function(){ ui.loadedFrom="drive"; updateExportState(); toast("Loaded from Adversaire drive"); return "drive"; })
      .catch(function(){
        return snapshotFetch()
          .then(function(){ ui.loadedFrom="snapshot"; updateExportState(); toast("Loaded shared data — read-only on this network"); return "snapshot"; })
          .catch(function(err){ if(opts.manual) toast("Couldn’t reach the shared data — showing local.", true); throw err; });
      });
  }
  function drivePush(){
    var url = driveUrl();
    if(!url){ toast("Set the Drive URL in Settings first.", true); return; }
    toast("Saving to Adversaire drive…");
    var out = JSON.parse(JSON.stringify(state));
    if(out.settings){ delete out.settings.driveUrl; delete out.settings.driveSync; }   // keep the shared file free of device config
    fetch(url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(out)})
      .then(function(res){ if(!res.ok) throw new Error("HTTP "+res.status); return res.text(); })
      .then(function(){ toast("Saved to Adversaire drive"); })
      .catch(function(err){ toast("Drive push failed: "+((err&&err.message)||err), true); });
  }

  // A transfer edit can add or remove the portion's unit choice and re-express its value. Swap only those
  // pieces, so the field being typed in keeps focus.
  function repaintPortionBox(el, box){
    if(!box) return;
    var uc = box.querySelector('[data-f="portionUnit"], .portion-unit');
    if(uc){ var tmp=document.createElement("div"); tmp.innerHTML=portionUnitControl(el); box.replaceChild(tmp.firstChild, uc); }
    var pi = box.querySelector('[data-f="portionExpr"]'); if(pi && document.activeElement!==pi) pi.value = portionRaw(el);
    var pe = box.querySelector(".eval-portion"); if(pe) pe.textContent = portionEvalText(el);
    var ce = box.querySelector(".eval-conv"); if(ce) ce.textContent = convEvalText(el);
  }
  function onFieldEdit(e){
    var inp = e.target.closest("[data-f]"); if(!inp) return;
    var f = inp.dataset.f;
    var erow = inp.closest("tr[data-id]");
    if(erow){
      var el=elem(erow.dataset.id);
      if(el){
        var box = inp.closest(".portion-box");
        if(f==="hasPortion"){
          if(e.type!=="change") return;          // checkbox fires input then change — act once, then repaint the row
          var hq=convQty(el), hu=convUnit(el);
          el.hasPortion = inp.checked; el.modified = nowStamp();
          // The transfer only lives alongside a portion, so it goes with it — and whatever was written
          // in its unit is re-expressed in pack units on the way out.
          coercePortionUnit(el, hq, hu); coerceLinesTo(el, hq, hu);
          save(); render(); return;
        }
        if(f==="unit"){
          var uq=convQty(el), uu=convUnit(el);
          el.unit = inp.value;
          if(el.convUnit===el.unit){ el.convUnit=null; el.convQty=null; el.convExpr=null; }   // nothing transfers into itself
          coercePortionUnit(el, uq, uu); coerceLinesTo(el, uq, uu);
          el.modified=nowStamp(); save(); render(); return;   // the row's unit captions are baked in — repaint it
        }
        if(f==="convUnit"){
          if(e.type!=="change") return;
          var cq=convQty(el), cu=convUnit(el);
          el.convUnit = inp.value || null;
          coercePortionUnit(el, cq, cu); coerceLinesTo(el, cq, cu);
          repaintPortionBox(el, box);
        }
        else if(f==="convExpr"){
          var craw=inp.value.trim(), cval=craw===""?0:evalExpr(craw), ces=box?box.querySelector(".eval-conv"):null;
          if(craw!=="" && (isNaN(cval) || cval<=0)){
            inp.classList.add("bad"); if(ces) ces.textContent="";
            if(e.type==="change"){   // on blur, restore the last good value rather than leave it broken
              inp.value=convRaw(el); inp.classList.remove("bad"); if(ces) ces.textContent=convEvalText(el);
            }
            return;
          }
          inp.classList.remove("bad");
          var xq=convQty(el), xu=convUnit(el);
          if(craw===""){
            // An empty field only counts as a clear once it is committed. Until then the transfer still
            // stands, so backspacing through it can't drag the portion and the recipes along with it.
            if(ces) ces.textContent="";
            if(e.type!=="change") return;
            el.convQty=null; el.convExpr=null;
          } else {
            el.convQty=cval; el.convExpr = isExpr(craw) ? craw : null;
            if(ces) ces.textContent = convEvalText(el);
          }
          // Units only move on commit, for the same reason.
          if(e.type==="change"){ coercePortionUnit(el, xq, xu); coerceLinesTo(el, xq, xu); repaintPortionBox(el, box); }
        }
        else if(f==="portionUnit"){
          if(e.type!=="change") return;
          setPortionUnit(el, inp.value);
          var pin=box?box.querySelector('[data-f="portionExpr"]'):null; if(pin) pin.value=portionRaw(el);
          var pev=box?box.querySelector(".eval-portion"):null; if(pev) pev.textContent=portionEvalText(el);
        }
        else if(f==="portionExpr"){
          var raw=inp.value, val=evalExpr(raw), esp=box?box.querySelector(".eval-portion"):null;
          if(isNaN(val) || val<0){
            inp.classList.add("bad"); if(esp) esp.textContent="";
            if(e.type==="change"){   // on blur, restore the last good value rather than leave it broken
              inp.value=portionRaw(el); inp.classList.remove("bad"); if(esp) esp.textContent=portionEvalText(el);
            }
            return;
          }
          inp.classList.remove("bad");
          el.portion=val; el.portionExpr = isExpr(raw) ? raw.trim() : null;
          if(esp) esp.textContent = portionEvalText(el);
        }
        else if(f==="size"||f==="cost") el[f]=num(inp.value);
        else el[f]=inp.value;
        if(f==="cost") el.priceDate=today();
        el.modified=nowStamp();
        var mrow=view.querySelector('tr[data-id="'+el.id+'"]');
        if(mrow){
          var pc=mrow.querySelector(".cell-portioncost"); if(pc) pc.innerHTML=portionCostCell(el);
          var md=mrow.querySelector(".cell-modified"); if(md) md.textContent=el.modified;
        }
        save();
      }
      return;
    }
    var crow = inp.closest("tr[data-cid]");
    if(crow){ var c=cat(crow.dataset.cid); if(c){ c[f]=(f==="ratio")?num(inp.value):(f==="desiredMargin"?clamp(num(inp.value),0,100):inp.value); save(); } return; }
    var ecrow = inp.closest("tr[data-ecid]");
    if(ecrow){ var ec=ecat(ecrow.dataset.ecid); if(ec){ ec[f]=inp.value; save(); } return; }
  }

  function repriceRow(row, active){
    if(!row) return;
    var r = findRecipe(row.dataset.rid); if(!r) return;
    var m = computeRecipe(r);
    var cc=row.querySelector(".cell-cost"); if(cc) cc.textContent=money(m.cost);
    var mi=row.querySelector("[data-rmarkup]");
    if(mi){
      if(active!=="markup") mi.value = m.markupMode==="inherited" ? "" : String(round2(m.markup));
      mi.placeholder = String(round2(m.inherited));
      mi.classList.remove("ov-red","ov-blue");
      if(m.markupMode==="override") mi.classList.add("ov-red"); else if(m.markupMode==="derived") mi.classList.add("ov-blue");
      var mr=row.querySelector('[data-act="reset-markup"]'); if(mr) mr.hidden = (m.markupMode!=="override");
    }
    var pi=row.querySelector("[data-rprice]");
    if(pi){
      if(active!=="price") pi.value = String(round2(m.price));
      pi.classList.toggle("ov-red", m.priceMode==="override");
      var pr2=row.querySelector('[data-act="reset-price"]'); if(pr2) pr2.hidden = (m.priceMode!=="override");
    }
    var mg=row.querySelector(".cell-margin"); if(mg) mg.innerHTML = marginInner(m);
    var di=row.querySelector("[data-rdesired]");
    if(di){
      if(active!=="desired") di.value = m.desiredMode==="override" ? String(round2(m.desired)) : "";
      di.placeholder = String(round2(m.inhMargin));
      di.classList.toggle("ov-red", m.desiredMode==="override");
      var dr=row.querySelector('[data-act="reset-desired"]'); if(dr) dr.hidden = (m.desiredMode!=="override");
    }
  }

      var nc = num(document.getElementById("e-cost").value);
      if(nc !== num(e.cost)) e.priceDate = today();
      var oq = convQty(e), ou = convUnit(e);          // the transfer the recipe lines were counting against
      e.name = name; e.notes = document.getElementById("e-notes").value;
      e.catId = document.getElementById("e-cat").value || null;
      e.cost = nc; e.size = num(document.getElementById("e-size").value); e.unit = document.getElementById("e-unit").value;
      e.hasPortion = wantsPortion;
      if(wantsPortion){
        e.convUnit = craw==="" ? null : (document.getElementById("e-convunit").value || null);
        e.convQty = e.convUnit ? cval : null;
        e.convExpr = (e.convUnit && isExpr(craw)) ? craw : null;
        e.portion = pval; e.portionExpr = isExpr(praw) ? praw.trim() : null;
        e.portionUnit = document.getElementById("e-portionunit").value;   // the number is read in the unit shown beside it
      }
      coercePortionUnit(e, oq, ou);   // dropping the portion or its transfer re-expresses it in pack units
      coerceLinesTo(e, oq, ou);
      e.modified = nowStamp();
      toast("Element saved");
    });
    (function(){
      var pe=document.getElementById("e-portion"), pv=document.getElementById("e-portion-eval");
      var cb=document.getElementById("e-hasportion"), wrap=document.getElementById("e-portion-wrap"), np=document.getElementById("e-noportion");
      var ce=document.getElementById("e-conv"), cv=document.getElementById("e-conv-eval"), cu=document.getElementById("e-convunit");
      var pu=document.getElementById("e-portionunit"), un=document.getElementById("e-unit"), cp=document.getElementById("e-conv-pack");
      if(!pe||!pv||!cb||!ce||!cu||!pu) return;
      var prev = { unit:portionUnitOf(e), edges:elemEdges(e) };   // the unit the portion field is written in, and the transfer it was written against
      // The element as the modal would save it right now — the portion's unit choice follows the transfer being typed.
      function pending(){
        var craw=ce.value.trim(), cval=evalExpr(craw), ok=(craw!=="" && !isNaN(cval) && cval>0);
        return { unit:un.value, hasPortion:cb.checked, convUnit: ok ? (cu.value||null) : null, convQty: ok?cval:0, portionUnit: pu.value };
      }
      // commit = the transfer has settled (a blur or a dropdown pick), so a unit may now be dropped;
      // mid-typing the current choice stays on screen rather than flickering away between keystrokes.
      function paintUnits(commit){
        var p=pending(), opts=portionUnitOptions(p), cur=pu.value||opts[0];
        // The transfer can't offer the pack unit, so its list is rebuilt whenever the pack unit moves.
        if(cp.textContent!==elemUnit(p)){ cp.textContent=elemUnit(p); cu.innerHTML=convUnitOptions({unit:p.unit, hasPortion:true, convUnit:cu.value}); }
        if(opts.indexOf(cur)<0){
          if(commit){
            var val=evalExpr(pe.value), f=unitFactor(cur, elemUnit(p), prev.edges);   // the unit it was written in is gone — re-express it in the pack unit
            if(!isNaN(val) && isFinite(f)) pe.value=fmtNum(val*f);
            cur=opts[0];
          } else opts=opts.concat([cur]);
        }
        pu.innerHTML = opts.map(function(u){ return '<option value="'+esc(u)+'"'+(u===cur?" selected":"")+'>'+esc(u)+'</option>'; }).join("");
        pu.value = cur;
        prev.unit = cur;
        // Only a real transfer becomes the basis for a later conversion — an empty or half-typed one
        // must not erase the transfer the portion on screen is still written against.
        if(hasConv(p)) prev.edges = elemEdges(p);
        updConv(); upd();
      }
      function updConv(){
        var raw=ce.value.trim();
        if(raw===""){ ce.classList.remove("bad"); cv.style.color=""; cv.textContent=""; return; }
        var val=evalExpr(raw);
        if(isNaN(val)||val<=0){ ce.classList.add("bad"); cv.style.color="var(--bad)"; cv.textContent="Not a valid positive number or equation."; return; }
        ce.classList.remove("bad"); cv.style.color="";
        cv.textContent = isExpr(raw) ? ("= "+fmtNum(val)+" "+(cu.value||"")) : "";
      }
      function upd(){
        var raw=pe.value, val=evalExpr(raw), p=pending();
        if(raw.trim()===""){ pe.classList.remove("bad"); pv.style.color=""; pv.textContent=""; return; }
        if(isNaN(val)||val<0){ pe.classList.add("bad"); pv.style.color="var(--bad)"; pv.textContent="Not a valid number or equation."; return; }
        pe.classList.remove("bad"); pv.style.color="";
        // Only worth spelling out while the portion is in the pack unit — otherwise the dropdown beside it says it all.
        pv.textContent = (portionUnitOf(p)===elemUnit(p) && isExpr(raw)) ? ("= "+fmtNum(val)+" "+elemUnit(p)) : "";
      }
      function toggle(){ wrap.hidden = !cb.checked; np.hidden = cb.checked; if(cb.checked) paintUnits(true); }
      pe.addEventListener("input", upd);
      ce.addEventListener("input", function(){ paintUnits(false); });
      ce.addEventListener("change", function(){ paintUnits(true); });
      cu.addEventListener("change", function(){ paintUnits(true); });
      un.addEventListener("change", function(){ paintUnits(true); });
      // Switching the portion's unit re-expresses the same quantity, as the row editor does.
      pu.addEventListener("change", function(){
        var p=pending(), val=evalExpr(pe.value), f=unitFactor(prev.unit, pu.value, elemEdges(p));
        if(!isNaN(val) && isFinite(f)) pe.value = fmtNum(val*f);
        prev.unit = pu.value;
        if(hasConv(p)) prev.edges = elemEdges(p);
        upd();
      });
      cb.addEventListener("change", toggle);
      toggle();
    })();
  }
  function addCategory(){
    var c = { id:uid("c"), name:"", ratio:3, desiredMargin:65 };
    state.categories.push(c); save(); render();
    var row = view.querySelector('tr[data-cid="'+c.id+'"]'); if(row){ var inp=row.querySelector('input[data-f="name"]'); if(inp) inp.focus(); }
  }
  function addElementCategory(){
    var c = { id:uid("ec"), name:"" };
    state.elementCategories.push(c); save(); render();
    var row = view.querySelector('tr[data-ecid="'+c.id+'"]'); if(row){ var inp=row.querySelector('input[data-f="name"]'); if(inp) inp.focus(); }
  }
  function addUnit(){
    var el = document.getElementById("unit-new"); if(!el) return;
    var v = (el.value||"").trim(); if(!v) return;
    if(state.settings.units.indexOf(v)<0) state.settings.units.push(v);
    save(); render(); var n=document.getElementById("unit-new"); if(n) n.focus();
  }
  function saveSettings(){
    state.settings.currency = document.getElementById("set-cur").value || "$";
    state.settings.defaultRatio = num(document.getElementById("set-ratio").value)||1;
    state.settings.defaultMargin = clamp(num(document.getElementById("set-margin").value),0,100);
    state.settings.rounding = readRounding("g");
    state.settings.driveSync = document.getElementById("set-drive").checked;
    state.settings.driveUrl = (document.getElementById("set-driveurl").value||"").trim();
    save(); render(); toast("Settings saved");
  }

  render();
  // On open: pull shared data — live Adversaire drive if reachable, otherwise the same-origin snapshot (so it works even where Google is blocked).
  if(state.settings.driveSync){ syncShared({}).catch(function(){}); }
})();
</script>

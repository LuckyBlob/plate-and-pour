<html lang="fr">

  body{margin:0;background:#070606;color:#fff;
       font-family:Montserrat,"Helvetica Neue",Helvetica,Arial,sans-serif}

  .note{max-width:1000px;margin:14px auto 0;padding:10px 14px;color:#fab219;font-size:12px;
        border:2px solid #fab219;box-sizing:border-box}
  @media(min-width:1037px){.note{margin:14px auto 0}}

<script>

   intercepte l'appel réseau pour répondre à sa place. Rien de tout ceci ne
   peut se retrouver sur le site : ce fichier n'y est jamais collé.

   Le format est exactement celui que renvoie quizz-bridge.gs : les cellules
   telles qu'elles s'affichent dans la feuille — colonne d'étiquettes « ronde N »
   comprise. « Courante » reprend la vraie feuille (noms longs inclus, pour

(function () {
  var realFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = function (url, opts) {
    if (String(url).indexOf(FAUX_ENDPOINT) === 0) {
      return Promise.resolve({
        ok: true,
        status: 200,
        json: function () { return Promise.resolve(SAMPLE); },
        text: function () { return Promise.resolve(JSON.stringify(SAMPLE)); }
      });
    }
    return realFetch ? realFetch(url, opts) : Promise.reject(new Error("pas de fetch"));

<div class="wrap">
  <div id="quizz-adversaire"></div>
</div>

<script>
/* Charge le VRAI fichier d'intégration, sans copie : on prend le <script> tel
   quel et on le pose dans le conteneur, exactement comme le fait le site. Seule
   retouche : l'adresse /exec encore vierge devient celle du faux Google. */
fetch("quizz-embed.html")
  .then(function (r) { return r.text(); })
  .then(function (html) {
    var doc = new DOMParser().parseFromString(html, "text/html");
    var src = doc.querySelector("script").textContent
      .replace(/ENDPOINT:\s*"[^"]*"/, 'ENDPOINT: "' + FAUX_ENDPOINT + '"');
    var tag = document.createElement("script");
    tag.textContent = src;
    document.getElementById("quizz-adversaire").appendChild(tag);
  })
  .catch(function (e) {
    document.getElementById("quizz-adversaire").textContent =
      "Impossible de lire quizz-embed.html (" + e.message +
      ") — sers le dossier en HTTP plutôt que d'ouvrir le fichier directement.";
  });
</script>

<script>
/* Charge le VRAI fichier d'intégration, sans copie : on prend le <script> tel

   retouche : l'adresse /exec encore vierge devient celle du faux Google. */
fetch("quizz-embed.html")
  .then(function (r) { return r.text(); })
  .then(function (html) {
    var doc = new DOMParser().parseFromString(html, "text/html");

      .replace(/ENDPOINT:\s*"[^"]*"/, 'ENDPOINT: "' + FAUX_ENDPOINT + '"');
    var tag = document.createElement("script");
    tag.textContent = src;
    document.getElementById("quizz-adversaire").appendChild(tag);
  })
  .catch(function (e) {
    document.getElementById("quizz-adversaire").textContent =
      "Impossible de lire quizz-embed.html (" + e.message +
      ") — sers le dossier en HTTP plutôt que d'ouvrir le fichier directement.";
